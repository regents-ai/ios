app = "regents-mobile-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# All server state (wallet intents, voice sessions, push tokens, webhook
# dedupe, transaction event feed) lives in Redis (REDIS_URL), so machines are
# stateless and the app can scale beyond one machine.
[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  # Readiness, not liveness: /readyz PINGs Redis so a machine with a dead
  # Redis connection is marked unhealthy. Plain liveness stays at /healthz.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/readyz"

# Fly managed Prometheus scrapes the app registry (process, request timing,
# and mobile product counters) and adds the `app` label itself.
[metrics]
  port = 8080
  path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
