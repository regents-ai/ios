        amount:
          type: string
        currency:
          type: string
        destinationWalletAddress:
          type: string
          description: Must match the transaction `to` address.
          pattern: '^0x[a-fA-F0-9]{40}$'
        chainId:
          type: integer
          enum: [8453]
        expectedSigner:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        to:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        value:
          type: string
          pattern: '^[0-9]+$'
        data:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})*$'
    TerminalSessionStatus:
      type: string
      enum: [idle, running, waiting, failed]
    PendingTerminalApproval:
      type: object
      required: [requestId, action, regentName, riskCopy, expiresAt, resolved]
      properties:
        requestId:
          type: string
        action:
          type: string
        regentName:
          type: string
        riskCopy:
          type: string
        amount:
          type: string
        currency:
          type: string
        contractAddress:
          type: string
        expiresAt:
          type: string
          format: date-time
        resolved:
          type: boolean
    TerminalSessionSummary:
      type: object
      required:
        - id
        - title
        - agentId
        - agentName
        - status
        - latestNote
        - lastUpdatedAt
      properties:
        id:
          type: string
        title:
          type: string
        agentId:
          type: string
        agentName:
          type: string
        status:
          $ref: '#/components/schemas/TerminalSessionStatus'
        latestNote:
          type: string
        lastUpdatedAt:
          type: string
          format: date-time
        pendingApproval:
          $ref: '#/components/schemas/PendingTerminalApproval'
    TerminalSessionDetail:
      allOf:
        - $ref: '#/components/schemas/TerminalSessionSummary'
        - type: object
          required: [composerPlaceholder]
          properties:
            composerPlaceholder:
              type: string
    CreateTerminalSessionRequest:
      type: object
      required: [agentId, agentName]
      properties:
        agentId:
          type: string
        agentName:
          type: string
    CoinbaseProxyRequest:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: string
          enum:
            - buy_config
            - buy_options
            - buy_transactions
            - sell_transactions
            - onramp_session
            - onramp_order
            - onramp_limits
            - offramp_token
        partnerUserRef:
          type: string
          description: Required for operations scoped to the signed-in mobile user.
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        body:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
          description: Required for creating Coinbase onramp sessions and guest checkout orders.
    CoinbaseOnrampWebhook:
      type: object
      additionalProperties: false
      required: [eventType, transactionId]
      properties:
        eventType:
          type: string
          enum:
            - onramp.transaction.created
            - onramp.transaction.updated
            - onramp.transaction.success
            - onramp.transaction.failed
        transactionId:
          type: string
        partnerUserRef:
          type: string
        purchaseAmount:
          type: string
        purchaseCurrency:
          type: string
        destinationNetwork:
          type: string
        failureReason:
          type: string
    TerminalEvent:
      type: object
      required: [eventId, type, sessionId, ts]
      properties:
        eventId:
          type: string
        type:
          type: string
        sessionId:
          type: string
        ts:
          type: string
          format: date-time
        chunk:
          type: string
        text:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        status:
          type: string
        requestId:
          type: string
        action:
          type: string
        regentName:
          type: string
        riskCopy:
          type: string
        amount:
          type: string
        currency:
          type: string
        contractAddress:
          type: string
        result:
          type: string
          enum: [approved, denied, timed_out]
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, product, status, path, request_id, message]
          properties:
            code:
              type: string
            product:
              type: string
              enum: [ios]
            status:
              type: integer
            path:
              type: string
            request_id:
              type: string
              nullable: true
            message:
              type: string
            next_steps:
              type: string
              nullable: true
          additionalProperties: false
