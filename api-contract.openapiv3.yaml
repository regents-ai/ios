          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformWebhookToken:
      type: apiKey
      in: header
      name: X-Regent-Platform-Webhook-Token
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegentStatus:
      type: string
      enum: [active, attention, paused]
    RegentRuntimeStatus:
      type: string
      enum: [online, waiting, offline]
    PlatformFormationStatus:
      type: string
      enum: [pending, blocked, provisioning, ready]
    PlatformBillingStatus:
      type: string
      enum: [trial, free-day, prepaid, paused, zero, failed]
    PlatformRuntimeStatus:
      type: string
      enum: [provisioning, ready, paused, blocked]
    RegentPlatformState:
      type: object
      required:
        - claimedName
        - slug
        - formationStatus
        - billingStatus
        - runtimeStatus
        - blockers
        - dashboardUrl
      properties:
        claimedName:
          type: string
        slug:
          type: string
        formationStatus:
          $ref: '#/components/schemas/PlatformFormationStatus'
        billingStatus:
          $ref: '#/components/schemas/PlatformBillingStatus'
        runtimeStatus:
          $ref: '#/components/schemas/PlatformRuntimeStatus'
        blockers:
          type: array
          items:
            type: string
        dashboardUrl:
          type: string
          format: uri
        prepaidBalanceUsd:
          type: string
        freeDayEndsAt:
          type: string
          format: date-time
        nextPauseAt:
          type: string
          format: date-time
    RegentSummary:
      type: object
      required:
        - id
        - name
        - status
        - runtimeStatus
        - walletAddress
        - platformState
        - voice
        - lastActiveAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/RegentStatus'
        runtimeStatus:
          $ref: '#/components/schemas/RegentRuntimeStatus'
        walletAddress:
          type: string
        platformState:
          $ref: '#/components/schemas/RegentPlatformState'
        voice:
          $ref: '#/components/schemas/MobileRegentVoice'
        lastActiveAt:
          type: string
          format: date-time
        treasuryNote:
          type: string
    RegentActivity:
      type: object
      required: [id, title, detail, at]
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        at:
          type: string
          format: date-time
    MobileRegentBaseSnapshot:
      type: object
      additionalProperties: false
      required: [chainId, blockNumber, contractAddress, observedAt, stale, snapshot]
      properties:
        chainId:
          type: integer
          enum: [8453]
        blockNumber:
          type: integer
          nullable: true
          minimum: 0
        contractAddress:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        snapshot:
          type: object
          additionalProperties: false
          required: [regentId, name, walletAddress, runtimeStatus, platformState]
          properties:
            regentId:
              type: string
            name:
              type: string
            walletAddress:
              type: string
            runtimeStatus:
              $ref: '#/components/schemas/RegentRuntimeStatus'
            platformState:
              $ref: '#/components/schemas/RegentPlatformState'
    RegentReturnRequest:
      type: object
      required:
        - id
        - regentId
        - amount
        - currency
        - destinationWalletAddress
        - chainId
        - expectedSigner
        - to
        - value
        - data
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        regentId:
          type: string
        amount:
          type: string
        currency:
          type: string
        destinationWalletAddress:
          type: string
          description: Must match the transaction `to` address.
          pattern: '^0x[a-fA-F0-9]{40}$'
        chainId:
          type: integer
          enum: [8453]
        expectedSigner:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        to:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        value:
          type: string
          pattern: '^[0-9]+$'
        data:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})*$'
        status:
          type: string
          enum: [requested, approved, broadcasting, confirmed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        txHash:
          type: string
        blockNumber:
          type: integer
          minimum: 0
    CreateRegentFundingIntent:
      type: object
      required:
        - amount
        - currency
        - sourceWalletAddress
        - destinationWalletAddress
        - chainId
        - tokenAddress
        - tokenDecimals
        - expectedSigner
        - to
        - value
        - data
      properties:
        amount:
          type: string
        currency:
          type: string
        sourceWalletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        destinationWalletAddress:
          type: string
          description: Must match the Regent wallet address from the current Platform projection and the ERC-20 transfer recipient.
          pattern: '^0x[a-fA-F0-9]{40}$'
        chainId:
          type: integer
          enum: [8453]
        tokenAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        tokenDecimals:
          type: integer
          description: Decimals of the token being transferred. The displayed amount is checked against the transfer calldata using these decimals.
          minimum: 0
          maximum: 255
        expectedSigner:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        to:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        value:
          type: string
