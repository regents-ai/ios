openapi: 3.0.3
info:
  title: Regents Mobile API
  version: 0.2.0
  description: |
    Source-of-truth contract for the current Regents Mobile backend surface.

    Mobile wallet flows are live. Mobile Regent records are sourced from Platform projection.
    Message records are sourced from Platform Regent Work Runtime. The mobile backend only owns
    wallet intent and receipt state needed for phone wallet rails.
x-regent-capability:
  status: beta
  owner: ios
  money_path: true
  cli_surface: false
  mobile_surface: true
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: IP and route based
    authenticated_browser_mobile: verified mobile user based
    verified_cli_signed_agent: not exposed in this contract
    internal_service: not exposed in this contract
  cli_allowance_requires_verified_siwa: false
x-regent-message-contract:
  owner: ios
  routes:
    - /mobile/message/threads
    - /mobile/message/threads/{thread_id}
    - /mobile/message/threads/{thread_id}/events
    - /mobile/message/threads/{thread_id}/messages
    - /mobile/message/threads/{thread_id}/approvals/{approval_id}
    - /internal/mobile/message/push
  talk_source: Platform Regent Work Runtime
  transport_boundary: Mobile Message threads are sourced from Platform Regent Work Runtime. The mobile app does not own a separate peer-to-peer message transport.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Check whether the mobile backend is running (liveness)
      responses:
        '200':
          description: Backend health status
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
  /readyz:
    get:
      operationId: getReadyz
      summary: Check whether the mobile backend's dependencies are reachable (readiness)
      responses:
        '200':
          description: Backend dependencies are reachable
          content:
            application/json:
              schema:
                type: object
                required: [ok, redis]
                properties:
                  ok:
                    type: boolean
                  redis:
                    type: string
                    enum: [ok, unreachable, not_configured]
        '503':
          description: A backend dependency is unreachable
          content:
            application/json:
              schema:
                type: object
                required: [ok, redis]
                properties:
                  ok:
                    type: boolean
                  redis:
                    type: string
                    enum: [ok, unreachable, not_configured]
  /metrics:
    get:
      operationId: getMetrics
      summary: Read Prometheus metrics for the mobile backend
      responses:
        '200':
          description: Prometheus text exposition of backend process, request, and product metrics
          content:
            text/plain:
              schema:
                type: string
  /.well-known/jwks.json:
    get:
      operationId: getCdpJwks
      summary: Fetch public keys for Coinbase custom sign-in tokens
      responses:
        '200':
          description: Public signing keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: Signing keys are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/me:
    get:
      operationId: getCurrentMobileUser
      summary: Fetch the current signed-in mobile user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current mobile user
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId:
                    type: string
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/cdp-token:
    post:
      operationId: createCdpToken
      summary: Create one Coinbase custom sign-in token for the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coinbase custom sign-in token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '401':
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Coinbase custom sign-in is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /server/api:
    post:
      operationId: proxyCoinbaseRequest
      summary: Proxy one signed Coinbase request for mobile wallet flows
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseProxyRequest'
      responses:
        '200':
          description: Coinbase response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid proxy request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase signing is not configured for this build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /balances/evm:
    get:
      operationId: getEvmBalances
      summary: Fetch EVM token balances for one wallet address
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [base, ethereum, base-sepolia, ethereum-sepolia]
      responses:
        '200':
          description: EVM token balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          description: Invalid balance request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase balance access is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /balances/solana:
    get:
      operationId: getSolanaBalances
      summary: Fetch Solana token balances for one wallet address
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [solana, solana-devnet]
      responses:
        '200':
          description: Solana token balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          description: Invalid balance request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase balance access is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens/ping:
    post:
      operationId: recordPushTokenPing
      summary: Record one push-token registration attempt
      responses:
        '200':
          description: Push registration attempt received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens:
    post:
      operationId: registerPushToken
      summary: Register one push token for the signed-in user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '200':
          description: Push token registered
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '400':
          description: Push token request is incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Push token belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens/debug/{user_id}:
    get:
      operationId: getPushTokenDebug
      summary: Fetch push-token status for the signed-in user or their review mirror
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Push-token status without raw token values
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Push-token status belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /webhooks/onramp:
    post:
      operationId: receiveOnrampWebhook
      summary: Receive one signed Coinbase onramp or offramp transaction webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseTransactionWebhook'
      responses:
        '200':
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                  duplicate:
                    type: boolean
        '400':
          description: Webhook body does not match the current contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Webhook signature is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Webhook processing failed after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Webhook verification is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /events/onramp:
    get:
      operationId: listOnrampTransactionEvents
      summary: List the signed-in user's recent Coinbase transaction webhook events
      description: >-
        Read-only feed of onramp and offramp transaction lifecycle events recorded
        from verified Coinbase webhooks. Events are scoped to the authenticated
        user and never move funds.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent transaction events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionEvent'
        '401':
          description: Access token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /internal/mobile/message/push:
    post:
      operationId: sendMobileMessagePush
      summary: Send one mobile Message push notification from a Platform RWR event
      security:
        - platformWebhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileMessagePushRequest'
      responses:
        '202':
          description: Push trigger accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileMessagePushResponse'
        '400':
          description: Push trigger body does not match the current contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Platform webhook token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Push trigger or delivery is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents:
    get:
      operationId: listMobileRegents
      summary: List mobile Regent cards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mobile Regent list
          content:
            application/json:
              schema:
                type: object
                required: [regents]
                properties:
                  regents:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegentSummary'
        '502':
          description: Platform projection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Platform projection base URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}:
    get:
      operationId: getMobileRegent
      summary: Fetch one mobile Regent card
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mobile Regent detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegentDetail'
        '404':
          description: Regent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Platform projection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Platform projection base URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/manager:
    get:
      operationId: getMobileRegentManager
      summary: Fetch one Regent Manager summary
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Regent Manager summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegentManagerDetail'
        '404':
          description: Regent Manager summary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/base-snapshot:
    get:
      operationId: getMobileRegentBaseSnapshot
      summary: Fetch one mobile Regent Base snapshot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mobile Regent Base snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentBaseSnapshot'
        '404':
          description: Regent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Platform projection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Platform projection base URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/return-requests:
    post:
      operationId: createRegentReturnRequest
      summary: Create one Regent-to-wallet return request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Reuse the same value if the same return request is submitted again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegentReturnRequest'
      responses:
        '201':
          description: Return request created
          content:
            application/json:
              schema:
                type: object
                required: [returnRequest]
                properties:
                  returnRequest:
                    $ref: '#/components/schemas/RegentReturnRequest'
        '404':
          description: Regent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/funding-intents:
    post:
      operationId: createRegentFundingIntent
      summary: Create one wallet-to-Regent funding intent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegentFundingIntent'
      responses:
        '201':
          description: Funding intent created
          content:
            application/json:
              schema:
                type: object
                required: [fundingIntent]
                properties:
                  fundingIntent:
                    $ref: '#/components/schemas/RegentFundingIntent'
        '400':
          description: Invalid funding details or funding destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Regent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Regent wallet is not ready for funding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/funding-intents/{funding_intent_id}:
    get:
      operationId: getRegentFundingIntent
      summary: Fetch one wallet-to-Regent funding intent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: funding_intent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Funding intent detail
          content:
            application/json:
              schema:
                type: object
                required: [fundingIntent]
                properties:
                  fundingIntent:
                    $ref: '#/components/schemas/RegentFundingIntent'
        '404':
          description: Funding intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/funding-intents/{funding_intent_id}/confirm:
    post:
      operationId: confirmRegentFundingIntent
      summary: Confirm one wallet-to-Regent funding intent with a chain receipt
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: funding_intent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmChainReceiptRequest'
      responses:
        '200':
          description: Funding intent confirmed from chain receipt
          content:
            application/json:
              schema:
                type: object
                required: [fundingIntent]
                properties:
                  fundingIntent:
                    $ref: '#/components/schemas/RegentFundingIntent'
        '404':
          description: Funding intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Chain receipt is not ready or does not match this funding intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base RPC receipt lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured for receipt verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/return-requests/{return_request_id}:
    get:
      operationId: getRegentReturnRequest
      summary: Fetch one Regent-to-wallet return request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: return_request_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Return request detail
          content:
            application/json:
              schema:
                type: object
                required: [returnRequest]
                properties:
                  returnRequest:
                    $ref: '#/components/schemas/RegentReturnRequest'
        '404':
          description: Return request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regents/{id}/return-requests/{return_request_id}/confirm:
    post:
      operationId: confirmRegentReturnRequest
      summary: Confirm one Regent return request with a chain receipt
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: return_request_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmChainReceiptRequest'
      responses:
        '200':
          description: Return request confirmed from chain receipt
          content:
            application/json:
              schema:
                type: object
                required: [returnRequest]
                properties:
                  returnRequest:
                    $ref: '#/components/schemas/RegentReturnRequest'
        '404':
          description: Return request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Chain receipt is not ready or does not match this return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base RPC receipt lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured for receipt verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking:
    get:
      operationId: getMobileRegentStaking
      summary: Fetch the current mobile REGENT staking snapshot
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current staking snapshot
          content:
            application/json:
              schema:
                type: object
                required: [staking]
                properties:
                  staking:
                    $ref: '#/components/schemas/RegentStakingState'
        '400':
          description: Wallet address is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Platform staking is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Platform base URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/stake:
    post:
      operationId: stakeMobileRegent
      summary: Prepare a mobile REGENT stake action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingStakeRequest'
      responses:
        '200':
          description: Staking action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Platform staking is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Platform base URL is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
