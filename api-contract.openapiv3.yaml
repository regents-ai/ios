    CoinbaseProxyRequest:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: string
          enum:
            - buy_config
            - buy_options
            - buy_transactions
            - sell_transactions
            - onramp_session
            - onramp_order
            - onramp_limits
            - offramp_token
        partnerUserRef:
          type: string
          description: >-
            Required for operations scoped to the signed-in mobile user. Must
            equal the authenticated user id. For onramp_session and
            onramp_order the server always stamps the authenticated user id
            into the outbound Coinbase request body as partnerUserRef, so
            webhook events map back to the user regardless of the client body.
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        body:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
          description: Required for creating Coinbase onramp sessions and guest checkout orders.
    CoinbaseTransactionWebhook:
      type: object
      description: >-
        Inbound Coinbase onramp/offramp webhook payload. Coinbase owns this shape,
        so unknown extra fields are accepted and ignored. The server normalizes
        every accepted payload to one canonical internal event before processing:
        `onramp.transaction.completed` (sent by the Coinbase widget path) maps to
        `onramp.transaction.success`, object-form `purchaseAmount` maps to its
        string value, and `purchaseNetwork` maps to `destinationNetwork`.
      additionalProperties: true
      required: [eventType, transactionId]
      properties:
        eventType:
          type: string
          enum:
            - onramp.transaction.created
            - onramp.transaction.updated
            - onramp.transaction.success
            - onramp.transaction.completed
            - onramp.transaction.failed
            - offramp.transaction.created
            - offramp.transaction.updated
            - offramp.transaction.success
            - offramp.transaction.failed
        transactionId:
          type: string
        partnerUserRef:
          type: string
        purchaseAmount:
          oneOf:
            - type: string
            - type: object
              required: [value]
              properties:
                value:
                  type: string
                currency:
                  type: string
        purchaseCurrency:
          type: string
        destinationNetwork:
          type: string
        purchaseNetwork:
          type: string
        sellAmount:
          type: object
          properties:
            value:
              type: string
            currency:
              type: string
        network:
          type: string
        redirectUrl:
          type: string
          description: Offramp events may carry the partnerUserRef only as a query parameter here.
        failureReason:
          type: string
    TransactionEvent:
      type: object
      additionalProperties: false
      required: [eventType, transactionId, occurredAt]
      properties:
        eventType:
          type: string
          enum:
            - onramp.transaction.created
            - onramp.transaction.updated
            - onramp.transaction.success
            - onramp.transaction.failed
            - offramp.transaction.created
            - offramp.transaction.updated
            - offramp.transaction.success
            - offramp.transaction.failed
        transactionId:
          type: string
        occurredAt:
          type: string
          format: date-time
        amount:
          type: string
        currency:
          type: string
        network:
          type: string
        failureReason:
          type: string
    MessageThreadEvent:
      type: object
      required: [eventId, type, threadId, ts]
      properties:
        eventId:
          type: string
        type:
          type: string
        threadId:
          type: string
        ts:
          type: string
          format: date-time
        chunk:
          type: string
        text:
          type: string
