openapi: 3.0.3
info:
  title: Regents Mobile API
  version: 0.2.0
  description: |
    Source-of-truth contract for the current Regents Mobile backend surface.

    Mobile wallet flows are live. The mobile backend owns each signed-in user's "My agents"
    list: agents added by wallet address or paired by proving their key through a signed
    pairing request, with live Base USDC balances read for the list.
x-regent-capability:
  status: beta
  owner: ios
  money_path: true
  cli_surface: false
  mobile_surface: true
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: IP and route based
    authenticated_browser_mobile: verified mobile user based
    verified_cli_signed_agent: not exposed in this contract
    internal_service: not exposed in this contract
  cli_allowance_requires_verified_siwa: false
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Check whether the mobile backend is running (liveness)
      responses:
        '200':
          description: Backend health status
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
  /readyz:
    get:
      operationId: getReadyz
      summary: Check whether the mobile backend's dependencies are reachable (readiness)
      responses:
        '200':
          description: Backend dependencies are reachable
          content:
            application/json:
              schema:
                type: object
                required: [ok, redis]
                properties:
                  ok:
                    type: boolean
                  redis:
                    type: string
                    enum: [ok, unreachable, not_configured]
        '503':
          description: A backend dependency is unreachable
          content:
            application/json:
              schema:
                type: object
                required: [ok, redis]
                properties:
                  ok:
                    type: boolean
                  redis:
                    type: string
                    enum: [ok, unreachable, not_configured]
  /metrics:
    get:
      operationId: getMetrics
      summary: Read Prometheus metrics for the mobile backend
      responses:
        '200':
          description: Prometheus text exposition of backend process, request, and product metrics
          content:
            text/plain:
              schema:
                type: string
  /.well-known/jwks.json:
    get:
      operationId: getCdpJwks
      summary: Fetch public keys for Coinbase custom sign-in tokens
      responses:
        '200':
          description: Public signing keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: Signing keys are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/me:
    get:
      operationId: getCurrentMobileUser
      summary: Fetch the current signed-in mobile user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current mobile user
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId:
                    type: string
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/cdp-token:
    post:
      operationId: createCdpToken
      summary: Create one Coinbase custom sign-in token for the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coinbase custom sign-in token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '401':
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Coinbase custom sign-in is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /server/api:
    post:
      operationId: proxyCoinbaseRequest
      summary: Proxy one signed Coinbase request for mobile wallet flows
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseProxyRequest'
      responses:
        '200':
          description: Coinbase response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid proxy request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase signing is not configured for this build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /balances/evm:
    get:
      operationId: getEvmBalances
      summary: Fetch EVM token balances for one wallet address
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [base, ethereum, base-sepolia, ethereum-sepolia]
      responses:
        '200':
          description: EVM token balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          description: Invalid balance request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase balance access is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /balances/solana:
    get:
      operationId: getSolanaBalances
      summary: Fetch Solana token balances for one wallet address
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [solana, solana-devnet]
      responses:
        '200':
          description: Solana token balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          description: Invalid balance request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Coinbase balance access is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens/ping:
    post:
      operationId: recordPushTokenPing
      summary: Record one push-token registration attempt
      responses:
        '200':
          description: Push registration attempt received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens:
    post:
      operationId: registerPushToken
      summary: Register one push token for the signed-in user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '200':
          description: Push token registered
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '400':
          description: Push token request is incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Push token belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /push-tokens/debug/{user_id}:
    get:
      operationId: getPushTokenDebug
      summary: Fetch push-token status for the signed-in user or their review mirror
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Push-token status without raw token values
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Push-token status belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /webhooks/onramp:
    post:
      operationId: receiveOnrampWebhook
      summary: Receive one signed Coinbase onramp or offramp transaction webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseTransactionWebhook'
      responses:
        '200':
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                  duplicate:
                    type: boolean
        '400':
          description: Webhook body does not match the current contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Webhook signature is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Webhook processing failed after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Webhook verification is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /events/onramp:
    get:
      operationId: listOnrampTransactionEvents
      summary: List the signed-in user's recent Coinbase transaction webhook events
      description: >-
        Read-only feed of onramp and offramp transaction lifecycle events recorded
        from verified Coinbase webhooks. Events are scoped to the authenticated
        user and never move funds.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent transaction events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionEvent'
        '401':
          description: Access token is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/portfolio:
    get:
      operationId: getMobilePortfolio
      summary: Read what each listed wallet holds on Base, including its REGENT staking position
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: wallets
          required: true
          description: One to five comma-separated wallet addresses
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}(,0x[a-fA-F0-9]{40}){0,4}$'
      responses:
        '200':
          description: Holdings for every listed wallet, read at one Base block
          content:
            application/json:
              schema:
                type: object
                required: [portfolio]
                properties:
                  portfolio:
                    $ref: '#/components/schemas/BasePortfolio'
        '400':
          description: One to five valid wallet addresses are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking:
    get:
      operationId: getMobileRegentStaking
      summary: Read the wallet's REGENT staking figures from Base
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current staking snapshot
          content:
            application/json:
              schema:
                type: object
                required: [staking]
                properties:
                  staking:
                    $ref: '#/components/schemas/RegentStakingState'
        '400':
          description: Wallet address is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/stake:
    post:
      operationId: stakeMobileRegent
      summary: Prepare a REGENT stake call for the wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingAmountRequest'
      responses:
        '200':
          description: Staking action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/unstake:
    post:
      operationId: unstakeMobileRegent
      summary: Prepare a mobile REGENT unstake action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingAmountRequest'
      responses:
        '200':
          description: Unstake action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/claim-usdc:
    post:
      operationId: claimMobileRegentStakingUsdc
      summary: Prepare a mobile USDC claim action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingWalletRequest'
      responses:
        '200':
          description: USDC claim action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/claim-regent:
    post:
      operationId: claimMobileRegentStakingRegent
      summary: Prepare a mobile REGENT claim action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingWalletRequest'
      responses:
        '200':
          description: REGENT claim action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/regent/staking/claim-and-restake-regent:
    post:
      operationId: claimAndRestakeMobileRegentStakingRegent
      summary: Prepare a mobile REGENT claim and restake action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegentStakingWalletRequest'
      responses:
        '200':
          description: REGENT claim and restake action prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegentStakingActionResponse'
        '400':
          description: Staking input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/autolaunch/auctions/{auction_id}/position:
    get:
      operationId: getMobileAutolaunchAuctionPosition
      summary: Read the wallet's bids on one Autolaunch auction from Base
      description: >-
        Every figure is read at one Base block: where the auction stands, the
        wallet's balance of the auction's currency, and each bid the wallet
        placed with what collecting it would do right now.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auction_id
          description: The auction's Autolaunch id. Its address and quote token come from autolaunch.sh and are checked against Base.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
      responses:
        '200':
          description: Current auction position
          content:
            application/json:
              schema:
                type: object
                required: [position]
                properties:
                  position:
                    $ref: '#/components/schemas/AutolaunchAuctionPosition'
        '400':
          description: Auction or wallet address is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base could not be read, or Autolaunch could not confirm the auction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/autolaunch/auctions/{auction_id}/bid:
    post:
      operationId: prepareMobileAutolaunchBid
      summary: Prepare a bid on an Autolaunch auction
      description: >-
        Reviews the bid against the auction as it stands on Base and returns the
        calls the wallet signs, in order: the exact currency approval to
        Permit2 and the short-lived Permit2 allowance for the auction when the
        wallet still needs them, then the bid itself, owned by the wallet.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auction_id
          description: The auction's Autolaunch id. Its address and quote token come from autolaunch.sh and are checked against Base.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAutolaunchBidRequest'
      responses:
        '200':
          description: Bid prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAutolaunchBidResponse'
        '400':
          description: Bid input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The auction refuses this bid right now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base could not be read, or Autolaunch could not confirm the auction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/autolaunch/auctions/{auction_id}/settle:
    post:
      operationId: prepareMobileAutolaunchSettlement
      summary: Prepare the return and token collection for one bid
      description: >-
        Simulates what the auction would do for this bid right now and returns
        the accepted steps for the wallet to sign: the exit that returns unspent
        currency, then the claim that delivers tokens, in one signature.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auction_id
          description: The auction's Autolaunch id. Its address and quote token come from autolaunch.sh and are checked against Base.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAutolaunchSettlementRequest'
      responses:
        '200':
          description: Settlement prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAutolaunchSettlementResponse'
        '400':
          description: Settlement input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The auction refuses to settle this bid right now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Base could not be read, or Autolaunch could not confirm the auction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Base RPC is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /oauth/callback:
    get:
      operationId: bouncePortalOAuthCallback
      summary: Return a Nous Portal pairing result to the mobile app
      security: []
      parameters:
        - in: query
          name: code
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the fixed regentsmobile portal-return route with only code and state
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/portal-pairing/start:
    post:
      operationId: startMobilePortalPairing
      summary: Start pairing a Nous Portal account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portal pairing is ready to continue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPairingStartResponse'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Portal pairing is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/portal-pairing/complete:
    post:
      operationId: completeMobilePortalPairing
      summary: Complete pairing a Nous Portal account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalPairingCompleteRequest'
      responses:
        '200':
          description: Portal account paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPairingStatus'
        '400':
          description: Pairing return is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Pairing return has expired, was already used, or belongs to another signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Nous Portal could not complete pairing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Portal pairing is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/portal-pairing:
    get:
      operationId: getMobilePortalPairing
      summary: Read the signed-in user's Nous Portal pairing status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current Portal pairing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPairingStatus'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
    delete:
      operationId: disconnectMobilePortalPairing
      summary: Disconnect the signed-in user's Nous Portal account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portal account disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPairingStatus'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/agents:
    get:
      operationId: listMobileAgents
      summary: List the signed-in user's agents with live Base USDC balances
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user's agents
          content:
            application/json:
              schema:
                type: object
                required: [agents, balancesAvailable]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileAgent'
                  balancesAvailable:
                    type: boolean
                    description: False when Base balances could not be read; every usdcBalance is then null
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
    post:
      operationId: addMobileAgent
      summary: Add an agent by its Base wallet address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMobileAgentRequest'
      responses:
        '201':
          description: Agent added to the signed-in user's list
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    $ref: '#/components/schemas/MobileAgent'
        '400':
          description: Name, kind, or wallet address is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: An agent with this wallet address is already in the list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/agents/pairing-codes:
    post:
      operationId: createMobileAgentPairingCode
      summary: Create a single-use pairing code for an agent to prove its wallet key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileAgentPairingCodeRequest'
      responses:
        '201':
          description: Pairing code issued; it expires after ten minutes and works once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgentPairingCode'
        '400':
          description: Name or kind is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/agents/pairing-codes/{code}:
    get:
      operationId: getMobileAgentPairingCode
      summary: Check whether an agent has signed in with one of the signed-in user's pairing codes
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The code is waiting, needs the user's confirmation, or is gone (expired, used up, discarded or not theirs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAgentPairingStatus'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
    delete:
      operationId: discardMobileAgentPairingCode
      summary: Discard a pairing code ("Not mine"), dropping any address an agent signed in with
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The code is gone
          content:
            application/json:
              schema:
                type: object
                required: [discarded]
                properties:
                  discarded:
                    type: boolean
                    enum: [true]
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/agents/pairing-codes/{code}/confirm:
    post:
      operationId: confirmMobileAgentPairing
      summary: Confirm the address an agent signed in with, listing it as paired
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The agent is listed as paired; the code is spent
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    $ref: '#/components/schemas/MobileAgent'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The code expired or is not theirs, no agent has used it yet, or the list is full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /mobile/agents/{agent_id}:
    patch:
      operationId: renameMobileAgent
      summary: Rename one of the signed-in user's agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameMobileAgentRequest'
      responses:
        '200':
          description: Agent renamed
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    $ref: '#/components/schemas/MobileAgent'
        '400':
          description: Name is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No agent with this ID is in the signed-in user's list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
    delete:
      operationId: removeMobileAgent
      summary: Remove one of the signed-in user's agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
                    enum: [true]
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No agent with this ID is in the signed-in user's list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /agent/pair:
    post:
      operationId: pairMobileAgent
      summary: Pair an agent to the user who issued its pairing code (called by the agent)
      description: |
        Called by the agent itself, not the app. The request is a SIWA-signed HTTP request for the
        `regents-mobile` audience (headers `x-siwa-receipt`, `x-key-id`, `x-timestamp`,
        `x-agent-wallet-address`, `x-agent-chain-id`, `content-digest`, `signature-input`,
        `signature`), each exactly once and with no other `x-agent-*` or `x-siwa-*` headers, with a
        JSON body of at most 4 KiB. The backend verifies the envelope with the SIWA server for the
        Base wallet principal and, when the code is valid, records the verified wallet address as
        waiting for the user who created the code to confirm it in the app. Each signed request and
        each code can be used once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairMobileAgentRequest'
      responses:
        '200':
          description: The address is recorded; the user confirms it in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairMobileAgentAccepted'
        '400':
          description: Body is not JSON with a pairing code, or the proof headers are missing, repeated or accompanied by unknown agent headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: The signed request was rejected by the SIWA server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The pairing code is unknown, expired, or already used, or the signed request was already seen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The body is larger than 4 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: The body is not sent as JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Agent pairing is not available on this server, or the sign-in service is busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    WalletBalanceResponse:
      type: object
      required: [balances, totalBalances]
      properties:
        address:
          type: string
        network:
          type: string
        balances:
          type: array
          items:
            type: object
            additionalProperties: true
        totalBalances:
          type: integer
    RegisterPushTokenRequest:
      type: object
      additionalProperties: false
      required: [userId, pushToken, platform, tokenType]
      properties:
        userId:
          type: string
        pushToken:
          type: string
        platform:
          type: string
        tokenType:
          type: string
          enum: [native, expo]
    MobileRegentStakingWalletRequest:
      type: object
      additionalProperties: false
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
    MobileRegentStakingAmountRequest:
      type: object
      additionalProperties: false
      required: [walletAddress, amount]
      properties:
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        amount:
          type: string
    PortalPairingStartResponse:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
          format: uri
      additionalProperties: false
    PortalPairingCompleteRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      additionalProperties: false
    PortalPairingStatus:
      type: object
      required: [paired, accountLabel, pairedAt]
      properties:
        paired:
          type: boolean
        accountLabel:
          type: string
          nullable: true
        pairedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    BasePortfolio:
      description: What each listed wallet holds on Base, every figure read at the same block.
      type: object
      additionalProperties: false
      required: [chain_id, block_number, wallets]
      properties:
        chain_id:
          type: integer
          enum: [8453]
        block_number: { type: integer }
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/BaseWalletHoldings'
    BaseWalletHoldings:
      description: >-
        One wallet's ETH, USDC and REGENT balances and its REGENT staking
        position, as decimal token amounts.
      type: object
      additionalProperties: false
      required:
        - wallet_address
        - eth_balance
        - usdc_balance
        - regent_balance
        - staked_regent
        - claimable_usdc
        - claimable_regent
      properties:
        wallet_address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        eth_balance: { type: string }
        usdc_balance: { type: string }
        regent_balance: { type: string }
        staked_regent: { type: string }
        claimable_usdc: { type: string }
        claimable_regent: { type: string }
    RegentStakingState:
      description: >-
        One wallet's staking figures, every one read from Base at the same block.
        Raw values are atomic units; the others are decimal strings.
      type: object
      additionalProperties: false
      required:
        - chain_id
        - chain_label
        - block_number
        - contract_address
        - stake_token_address
        - usdc_address
        - paused
        - total_staked_raw
        - total_staked
        - wallet_address
        - wallet_token_balance_raw
        - wallet_token_balance
        - wallet_stake_allowance_raw
        - wallet_stake_balance_raw
        - wallet_stake_balance
        - wallet_claimable_usdc_raw
        - wallet_claimable_usdc
        - wallet_claimable_regent_raw
        - wallet_claimable_regent
        - wallet_funded_claimable_regent_raw
        - wallet_funded_claimable_regent
      properties:
        chain_id:
          type: integer
          enum: [8453]
        chain_label:
          type: string
          enum: [Base]
        block_number: { type: integer }
        contract_address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        stake_token_address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        usdc_address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        paused: { type: boolean }
        total_staked_raw: { type: string, pattern: '^[0-9]+$' }
        total_staked: { type: string }
        wallet_address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        wallet_token_balance_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_token_balance: { type: string }
        wallet_stake_allowance_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_stake_balance_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_stake_balance: { type: string }
        wallet_claimable_usdc_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_claimable_usdc: { type: string }
        wallet_claimable_regent_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_claimable_regent: { type: string }
        wallet_funded_claimable_regent_raw: { type: string, pattern: '^[0-9]+$' }
        wallet_funded_claimable_regent: { type: string }
    RegentStakingWalletAction:
      description: >-
        Calldata for one RegentRevenueStaking call on Base. The signer is the
        wallet named in the request and is also the receiver or recipient of
        every call. A stake carries the exact REGENT approval it needs; the app
        sends that approval first only when the current allowance is short.
      type: object
      additionalProperties: false
      required: [action, chain_id, to, value, data, expected_signer]
      properties:
        action:
          type: string
          enum: [stake, unstake, claim_usdc, claim_regent, claim_and_restake_regent]
        chain_id:
          type: integer
          enum: [8453]
        to:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        value:
          type: string
          enum: ['0']
        data:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})*$'
        expected_signer:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        approval:
          type: object
          additionalProperties: false
          required: [token, spender, amount, data]
          properties:
            token:
              type: string
              pattern: '^0x[a-fA-F0-9]{40}$'
            spender:
              type: string
              pattern: '^0x[a-fA-F0-9]{40}$'
            amount:
              type: string
              pattern: '^[0-9]+$'
            data:
              type: string
              pattern: '^0x([a-fA-F0-9]{2})*$'
    MobileRegentStakingActionResponse:
      type: object
      additionalProperties: false
      required: [wallet_action]
      properties:
        wallet_action:
          $ref: '#/components/schemas/RegentStakingWalletAction'
    MobileAutolaunchBidRequest:
      type: object
      additionalProperties: false
      required: [walletAddress, amount, maxPrice]
      properties:
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        amount:
          description: Whole currency units, at most as many decimals as the currency carries.
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
        maxPrice:
          description: The most the wallet pays per token, in whole currency units.
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
    MobileAutolaunchSettlementRequest:
      type: object
      additionalProperties: false
      required: [walletAddress, bidId]
      properties:
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        bidId:
          type: string
          pattern: '^[0-9]+$'
    AutolaunchWalletCall:
      type: object
      additionalProperties: false
      required: [step, to, value, data]
      properties:
        step:
          type: string
          enum: [token_approval, permit2_approval, bid, exit, claim]
        to:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        value:
          type: string
          enum: ['0']
        data:
          type: string
          pattern: '^0x([a-fA-F0-9]{2})*$'
    AutolaunchBidWalletAction:
      description: >-
        The calls one bid needs on Base, in order, all sent by the wallet named
        as expected_signer and owning the bid. The auction pulls its currency
        through Permit2, so a bid may be preceded by the exact currency
        approval to Permit2 and the exact Permit2 allowance for the auction.
      type: object
      additionalProperties: false
      required:
        [action, chain_id, auction_id, auction_address, expected_signer, block_number, calls, amount, amount_raw, max_price]
      properties:
        action:
          type: string
          enum: [bid]
        chain_id:
          type: integer
          enum: [8453]
        auction_id:
          type: string
        auction_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        expected_signer:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        block_number:
          type: integer
        calls:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutolaunchWalletCall'
        amount:
          type: string
        amount_raw:
          type: string
          pattern: '^[0-9]+$'
        max_price:
          description: The exact maximum the bid carries, aligned down to the auction's price step.
          type: string
    MobileAutolaunchBidResponse:
      type: object
      additionalProperties: false
      required: [wallet_action]
      properties:
        wallet_action:
          $ref: '#/components/schemas/AutolaunchBidWalletAction'
    AutolaunchSettlementWalletAction:
      type: object
      additionalProperties: false
      required:
        [action, chain_id, auction_id, auction_address, expected_signer, block_number, bid_id, calls, preview, currency_refunded, tokens_claimed]
      properties:
        action:
          type: string
          enum: [settle]
        chain_id:
          type: integer
          enum: [8453]
        auction_id:
          type: string
        auction_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        expected_signer:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        block_number:
          type: integer
        bid_id:
          type: string
          pattern: '^[0-9]+$'
        calls:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutolaunchWalletCall'
        preview:
          $ref: '#/components/schemas/AutolaunchSettlementPreview'
        currency_refunded:
          description: >-
            Whole currency units the exit returns; null when no exit is part of
            this settlement or the preview is unavailable.
          type: string
          nullable: true
        tokens_claimed:
          description: >-
            Whole tokens the claim delivers; null when no claim is part of this
            settlement or the preview is unavailable.
          type: string
          nullable: true
    MobileAutolaunchSettlementResponse:
      type: object
      additionalProperties: false
      required: [wallet_action]
      properties:
        wallet_action:
          $ref: '#/components/schemas/AutolaunchSettlementWalletAction'
    AutolaunchSettlementPreview:
      description: >-
        Whether the amounts come from a simulated settlement. When the
        simulation could not run, the steps are the ones the auction's rules
        allow at this block and the amounts are only known after collecting.
      type: string
      enum: [ready, unavailable]
    AutolaunchBidSettlement:
      description: >-
        What collecting this bid would do right now. Steps are empty while the
        auction is open or the auction refuses both steps; reason then says why.
      type: object
      additionalProperties: false
      required: [steps, preview, currency_refunded, tokens_claimed, reason]
      properties:
        steps:
          type: array
          items:
            type: string
            enum: [exit, claim]
        preview:
          $ref: '#/components/schemas/AutolaunchSettlementPreview'
        currency_refunded:
          type: string
          nullable: true
        tokens_claimed:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          enum:
            - auction_open
            - auction_not_ended
            - auction_not_started
            - already_returned
            - bid_needs_partial_exit
            - claim_not_open
            - nothing_to_claim
            - bid_not_returned
            - partial_exit_unavailable
            - settlement_reverted
            - null
    AutolaunchBidPosition:
      type: object
      additionalProperties: false
      required: [bid_id, amount_raw, amount, max_price, returned, tokens_filled, settlement]
      properties:
        bid_id:
          type: string
          pattern: '^[0-9]+$'
        amount_raw:
          type: string
          pattern: '^[0-9]+$'
        amount:
          type: string
        max_price:
          type: string
        returned:
          description: True once the bid's unspent currency has been returned.
          type: boolean
        tokens_filled:
          type: string
        settlement:
          $ref: '#/components/schemas/AutolaunchBidSettlement'
    AutolaunchAuctionPosition:
      type: object
      additionalProperties: false
      required:
        - chain_id
        - block_number
        - auction_id
        - auction_address
        - currency_address
        - currency_decimals
        - token_address
        - start_block
        - end_block
        - claim_block
        - phase
        - graduated
        - wallet_address
        - wallet_currency_balance_raw
        - wallet_currency_balance
        - bids
      properties:
        chain_id:
          type: integer
          enum: [8453]
        block_number:
          type: integer
        auction_id:
          type: string
        auction_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        currency_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        currency_decimals:
          type: integer
        token_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        start_block:
          type: integer
        end_block:
          type: integer
        claim_block:
          type: integer
        phase:
          type: string
          enum: [not_started, open, ended, claimable]
        graduated:
          description: As the final checkpoint records it once the auction has ended; null when that could not be read.
          type: boolean
          nullable: true
        wallet_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        wallet_currency_balance_raw:
          type: string
          pattern: '^[0-9]+$'
        wallet_currency_balance:
          type: string
        bids:
          type: array
          items:
            $ref: '#/components/schemas/AutolaunchBidPosition'
    CoinbaseProxyRequest:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: string
          enum:
            - buy_config
            - buy_options
            - buy_transactions
            - sell_transactions
            - onramp_session
            - onramp_order
            - onramp_limits
            - offramp_token
        partnerUserRef:
          type: string
          description: >-
            Required for operations scoped to the signed-in mobile user. Must
            equal the authenticated user id. For onramp_session and
            onramp_order the server always stamps the authenticated user id
            into the outbound Coinbase request body as partnerUserRef, so
            webhook events map back to the user regardless of the client body.
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        body:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
          description: Required for creating Coinbase onramp sessions and guest checkout orders.
    CoinbaseTransactionWebhook:
      type: object
      description: >-
        Inbound Coinbase onramp/offramp webhook payload. Coinbase owns this shape,
        so unknown extra fields are accepted and ignored. The server normalizes
        every accepted payload to one canonical internal event before processing:
        `onramp.transaction.completed` (sent by the Coinbase widget path) maps to
        `onramp.transaction.success`, object-form `purchaseAmount` maps to its
        string value, and `purchaseNetwork` maps to `destinationNetwork`.
      additionalProperties: true
      required: [eventType, transactionId]
      properties:
        eventType:
          type: string
          enum:
            - onramp.transaction.created
            - onramp.transaction.updated
            - onramp.transaction.success
            - onramp.transaction.completed
            - onramp.transaction.failed
            - offramp.transaction.created
            - offramp.transaction.updated
            - offramp.transaction.success
            - offramp.transaction.failed
        transactionId:
          type: string
        partnerUserRef:
          type: string
        purchaseAmount:
          oneOf:
            - type: string
            - type: object
              required: [value]
              properties:
                value:
                  type: string
                currency:
                  type: string
        purchaseCurrency:
          type: string
        destinationNetwork:
          type: string
        purchaseNetwork:
          type: string
        sellAmount:
          type: object
          properties:
            value:
              type: string
            currency:
              type: string
        network:
          type: string
        redirectUrl:
          type: string
          description: Offramp events may carry the partnerUserRef only as a query parameter here.
        failureReason:
          type: string
    TransactionEvent:
      type: object
      additionalProperties: false
      required: [eventType, transactionId, occurredAt]
      properties:
        eventType:
          type: string
          enum:
            - onramp.transaction.created
            - onramp.transaction.updated
            - onramp.transaction.success
            - onramp.transaction.failed
            - offramp.transaction.created
            - offramp.transaction.updated
            - offramp.transaction.success
            - offramp.transaction.failed
        transactionId:
          type: string
        occurredAt:
          type: string
          format: date-time
        amount:
          type: string
        currency:
          type: string
        network:
          type: string
        failureReason:
          type: string
    MobileAgentKind:
      type: string
      enum: [muse, grok_bot, hermes, other]
    MobileAgent:
      type: object
      required: [id, name, kind, walletAddress, paired, createdAt, usdcBalance]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/MobileAgentKind'
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: The agent's Base wallet address
        paired:
          type: boolean
          description: True only when the agent proved it holds this wallet's key through a pairing code
        createdAt:
          type: string
          format: date-time
        usdcBalance:
          type: string
          nullable: true
          description: Live Base USDC balance as a decimal string; null when Base could not be read
    AddMobileAgentRequest:
      type: object
      required: [name, kind, walletAddress]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          $ref: '#/components/schemas/MobileAgentKind'
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
    RenameMobileAgentRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    CreateMobileAgentPairingCodeRequest:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          $ref: '#/components/schemas/MobileAgentKind'
    MobileAgentPairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    PairMobileAgentRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
    PairMobileAgentAccepted:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [awaiting_confirmation]
        message:
          type: string
    MobileAgentPairingStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [waiting, needs_confirmation, expired]
        walletAddress:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Present when status is needs_confirmation
        expiresAt:
          type: string
          format: date-time
          description: Present when status is waiting or needs_confirmation
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, product, status, path, request_id, message]
          properties:
            code:
              type: string
            product:
              type: string
              enum: [ios]
            status:
              type: integer
            path:
              type: string
            request_id:
              type: string
              nullable: true
            message:
              type: string
            next_steps:
              type: string
              nullable: true
          additionalProperties: false
